name: Execute project notebook

on:
  push:
    branches: [main]
    paths:
      - '*.ipynb'
      - '*.csv'
      - 'requirements.txt'
      - '.github/workflows/execute-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-notebook-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert
      - name: Execute notebook and preserve outputs
        run: |
          NOTEBOOK="$(find . -maxdepth 1 -name '*.ipynb' -print -quit)"
          test -n "$NOTEBOOK"
          jupyter nbconvert --to notebook --execute --inplace "$NOTEBOOK" \
            --ExecutePreprocessor.timeout=3600 \
            --ExecutePreprocessor.allow_errors=True
      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.ipynb'
          if ! git diff --cached --quiet; then
            git commit -m "Add executed notebook outputs"
            git push
          else
            echo "Notebook outputs are already up to date."
          fi
